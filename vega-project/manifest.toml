schema-version = 1

[package]
title = "AnyStream"
version = "0.1.0"
build-number = 1
icon = "@image/icon.png"
id = "com.anystream.anystream"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_netmgr_lib_2@INetmgrTurbomodule_0"

[[needs.module]]
id = "/com.amazon.kepler.keplercrypto_2@IKeplercrypto_1"







[components]
[[components.interactive]]
id = "com.anystream.anystream.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[[wants.service]]
# Needed so the app can play video through the W3C media player.
id = "com.amazon.mediametrics.service"

[[wants.module]]
id = "/com.amazon.kepler.media@IMediaContentService_1"

[[wants.module]]
id = "/com.amazon.mediatransform.lib@IMediaBufferProvider_1"

[[wants.privilege]]
# Reach the Jellyfin server over the network.
id = "com.amazon.privilege.internet"

[[wants.service]]
# The media pipeline queries codec capabilities through this service; without it HEVC is filtered out.
id = "com.amazon.mediatransform.service"

# Refused in the device log ("Missing the permissions needed to connect"); audio.control is what
# lets the audio sink negotiate caps.
[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.privilege]]
# Required for captions.
id = "com.amazon.devconf.privilege.accessibility"

# Find servers on this network reads the TV IP address and netmask (keplerscript-netmgr-lib).
[[wants.service]]
id = "com.amazon.network.service"

[[wants.privilege]]
id = "com.amazon.network.privilege.net-info"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"
